version: '3.8'

services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: supermart-rabbitmq
    ports:
      - "5672:5672"     # Port AMQP
      - "15672:15672"   # Management Web Dashboard
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

volumes:
  rabbitmq_data:
